# First recovery run: load step 1000 weights with fresh PyTorch AdamW state.
# FP32 AdamW states require 8 bytes per trainable parameter element.
# To continue THIS recovery run later, set resume_ckpt_path: auto and
# restore_training_state: true. Otherwise it deliberately starts from 1000 again.
# Keeps SyncNet, LPIPS and TREPA enabled while explicitly offloading saved pixel-loss activations
# to pinned system RAM. This is slower than the 256 preset, but avoids uncontrolled WDDM paging.
data:
  syncnet_config_path: configs/syncnet/syncnet_16_pixel_attn.yaml
  train_output_dir: debug/unet/stage2_512_adamw_recovery
  # Reuse one stable directory across restarts; checkpoint step numbers remain unique.
  timestamped_run_dir: false
  train_fileslist: my_data/fileslist.txt
  train_data_dir: ""
  audio_embeds_cache_dir: my_data/cache/embeds
  audio_mel_cache_dir: my_data/cache/mel

  val_video_path: assets/demo1_video.mp4
  val_audio_path: assets/demo1_audio.wav
  batch_size: 1
  num_workers: 8
  num_frames: 16
  resolution: 512
  mask_image_path: latentsync/utils/mask.png
  audio_sample_rate: 16000
  video_fps: 25
  audio_feat_length: [2, 2]

ckpt:
  resume_ckpt_path: debug/unet/stage2_512_full_5090_offload/checkpoints/checkpoint-1000.pt
  restore_training_state: false
  resume_search_dir: debug/unet/stage1
  save_ckpt_steps: 100
  max_keep_ckpts: 4

run:
  pixel_space_supervise: true
  use_syncnet: true
  sync_loss_weight: 0.05
  perceptual_loss_weight: 0.1
  recon_loss_weight: 1
  guidance_scale: 1.5
  trepa_loss_weight: 10
  inference_steps: 20
  trainable_modules:
    - motion_modules.
    - attentions.
  seed: 1247
  use_mixed_noise: true
  mixed_noise_alpha: 1
  mixed_precision_training: true
  lpips_mixed_precision: true
  # UNet checkpointing is still needed. For the frozen pixel supervisors it is faster to retain
  # their activations through the selective CPU offload above than to recompute every block in
  # backward. This uses more pinned system RAM but preserves the exact same losses.
  enable_gradient_checkpointing: true
  vae_gradient_checkpointing: false
  syncnet_gradient_checkpointing: false
  trepa_gradient_checkpointing: false
  activation_cpu_offload: true
  activation_cpu_offload_pin_memory: true
  # Four MiB also catches the per-block VideoMAE token activations. Raise to 8 only if there is
  # clear dedicated-VRAM headroom; a higher threshold reduces PCIe traffic but retains more VRAM.
  activation_cpu_offload_min_mb: 4
  cudnn_benchmark: true
  allow_tf32: true
  log_steps: 10
  max_train_steps: 2000
  max_train_epochs: -1

optimizer:
  lr: 1e-5
  scale_lr: false
  max_grad_norm: 1.0
  lr_scheduler: constant
  lr_warmup_steps: 0

model:
  act_fn: silu
  add_audio_layer: true
  attention_head_dim: 8
  block_out_channels: [320, 640, 1280, 1280]
  center_input_sample: false
  cross_attention_dim: 384
  down_block_types:
    [
      "CrossAttnDownBlock3D",
      "CrossAttnDownBlock3D",
      "CrossAttnDownBlock3D",
      "DownBlock3D",
    ]
  mid_block_type: UNetMidBlock3DCrossAttn
  up_block_types:
    [
      "UpBlock3D",
      "CrossAttnUpBlock3D",
      "CrossAttnUpBlock3D",
      "CrossAttnUpBlock3D",
    ]
  downsample_padding: 1
  flip_sin_to_cos: true
  freq_shift: 0
  in_channels: 13
  layers_per_block: 2
  mid_block_scale_factor: 1
  norm_eps: 1e-5
  norm_num_groups: 32
  out_channels: 4
  sample_size: 64
  resnet_time_scale_shift: default

  use_motion_module: true
  motion_module_resolutions: [1, 2, 4, 8]
  motion_module_mid_block: false
  motion_module_decoder_only: false
  motion_module_type: Vanilla
  motion_module_kwargs:
    num_attention_heads: 8
    num_transformer_block: 1
    attention_block_types:
      - Temporal_Self
      - Temporal_Self
    temporal_position_encoding: true
    temporal_position_encoding_max_len: 24
    temporal_attention_dim_div: 1
    zero_initialize: true
